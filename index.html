<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分場卡片牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm editing-suite tool for daily use; precise, quiet, no props
   IDEA: the Save the Cat board read like an edit timeline — four lanes of index cards under one emotional curve
   PICTURE: the smooth emotion curve with beat markers, plus a tiny curve per film in the sidebar
   COLOUR and TYPE: warm paper grey and white cards, ink for actions, green/vermilion only for polarity, indigo only for the three beats; Noto Serif TC for scene sentences and titles, Noto Sans TC for UI
   LAYOUT: sidebar of walls, header with title and stats, curve panel, lanes; editor slides in from the right */
:root{color-scheme:light dark;
--bg:light-dark(#f3f1ec,#111111);--side:light-dark(#ebe8e1,#171717);--card:light-dark(#ffffff,#1d1d1d);--flat:light-dark(#f6f4ef,#181818);
--ink:light-dark(#1a1917,#ecebe7);--ink2:light-dark(#66625b,#a29e97);--ink3:light-dark(#9a958c,#6f6c66);
--line:light-dark(#e2ded5,#2a2a2a);--line2:light-dark(#cfcac0,#3b3b3b);--hover:light-dark(rgba(0,0,0,.045),rgba(255,255,255,.06));
--up:light-dark(#1d7a4c,#5cc391);--upbg:light-dark(#e4f2ea,#16301f);--dn:light-dark(#c2412d,#f2826d);--dnbg:light-dark(#fbe9e4,#3a1c16);
--beat:light-dark(#3a49d1,#97a2ff);--beatbg:light-dark(#e8eafc,#20234a);--warn:light-dark(#8a5a00,#e2b552);--warnbg:light-dark(#f8eed6,#33290f);
--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px -6px rgba(0,0,0,.12);--serif:"Noto Serif TC",serif;--sans:"Noto Sans TC"}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans),"Noto Sans TC",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--beat);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn svg{width:16px;height:16px;flex:none}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;font-weight:700;font-size:15px}
.brand svg{width:22px;height:22px}
.sec{font-size:12px;color:var(--ink3);padding:14px 8px 6px;display:flex;justify-content:space-between;align-items:center}
.sec button{color:var(--ink2);font-size:12px;padding:2px 6px;border-radius:5px}.sec button:hover{background:var(--hover);color:var(--ink)}
.fi{display:grid;grid-template-columns:minmax(0,1fr) 56px;align-items:center;gap:8px;width:100%;text-align:left;padding:8px;border-radius:8px;color:var(--ink2)}
.fi:hover{background:var(--hover);color:var(--ink)}.fi[aria-current=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.fi b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.fi small{font-size:12px;color:var(--ink3)}
.fi svg{width:56px;height:22px}
.status{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--up)}.status.off i{background:var(--warn)}
.main{padding:28px clamp(16px,3.5vw,44px) 60px;max-width:1500px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;margin-bottom:18px}
.ttl{flex:1 1 360px}
.src{display:inline-block;font-size:12px;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:1px 9px;margin-bottom:8px}
.ttl input{display:block;width:100%;font:700 clamp(26px,3vw,36px)/1.15 var(--serif);border:0;background:transparent;padding:2px 0;border-bottom:1px solid transparent}
.ttl input:hover{border-bottom-color:var(--line2)}.ttl input:focus{outline:0;border-bottom-color:var(--ink)}
.stats{display:flex;gap:26px}.stats div{font-size:12px;color:var(--ink3)}.stats b{display:block;font-size:22px;font-weight:500;color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px}
.note{font-size:13px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:8px 12px;margin-bottom:16px}
.curve{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:26px;padding:12px 14px 6px}
.curve header{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink3)}.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.fig{position:relative;height:176px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.lane{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px}
.lab{padding-top:10px}.lab h3{margin:0;font-size:15px;font-weight:700}.lab p{margin:2px 0 0;font-size:12px;color:var(--ink3)}
.cards{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;align-items:flex-start;min-height:120px;padding:4px 0}
.brk{display:flex;align-items:center;gap:10px;margin:14px 0}
.brk span{font-size:12px;font-weight:500;color:var(--beat);background:var(--beatbg);border-radius:999px;padding:2px 10px;white-space:nowrap}
.brk::after{content:"";flex:1;border-top:1px dashed var(--beat);opacity:.6}
.card{position:relative;width:198px;min-height:120px;height:auto;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px 11px;box-shadow:var(--sh);user-select:none;-webkit-user-select:none;cursor:grab;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card.key{border-color:var(--beat);box-shadow:0 0 0 1px var(--beat),var(--sh)}
.card.flat{background:var(--flat);border-style:dashed;border-color:var(--line2);box-shadow:none}
.ch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.no{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}.pl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grip{width:26px;height:24px;margin:-4px -7px -4px 0;display:grid;place-items:center;color:var(--ink3);border-radius:6px;touch-action:none;cursor:grab;opacity:0;transition:opacity .15s}
.grip svg{width:12px;height:14px}.card:hover .grip,.card:focus-within .grip{opacity:1}
@media(hover:none){.grip{opacity:1}}
.sum{display:block;margin:7px 0 10px;font:500 15.5px/1.5 var(--serif);max-height:4.5em;overflow:hidden;overflow-wrap:anywhere;text-align:left}
.sum.blank{color:var(--ink3);font-size:14px}
.cf{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;margin-top:auto}
.pol{display:inline-flex;align-items:center;gap:4px;font-weight:500;border-radius:6px;padding:1px 7px;white-space:nowrap}
.pol svg{width:14px;height:10px}
.pol.up{color:var(--up);background:var(--upbg)}.pol.dn{color:var(--dn);background:var(--dnbg)}.pol.fl{color:var(--warn);background:var(--warnbg)}
.cx{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.tags span{font-size:11.5px;color:var(--ink2);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.tags .k{color:var(--beat);border-color:var(--beat)}
.add{width:198px;min-height:120px;border:1px dashed var(--line2);border-radius:10px;color:var(--ink3);font-size:13px;display:grid;place-items:center;align-content:center;gap:4px}
.add:hover{border-color:var(--ink2);color:var(--ink);background:var(--hover)}.add svg{width:18px;height:18px}
.card.ph{opacity:.3;box-shadow:none;border-style:dashed;transform:none}
.dragcopy{position:fixed;left:0;top:0;z-index:60;pointer-events:none;box-shadow:0 22px 40px -14px rgba(0,0,0,.35),0 0 0 1px var(--line2);cursor:grabbing;transition:none}
.flash{animation:fl 1.1s ease}@keyframes fl{0%,45%{box-shadow:0 0 0 3px var(--beat)}}
.empty{max-width:440px;margin:12vh auto;text-align:center;color:var(--ink2)}
.empty svg{width:150px;height:90px;margin-bottom:12px}.empty h2{font:700 24px var(--serif);color:var(--ink);margin:0 0 6px}.empty p{margin:0 0 18px}
.newf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.newf input,.newf select,.libbar input{min-height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);padding:4px 10px;font-size:16px}
.newf input{flex:1 1 220px}
.libbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}.libbar input{width:min(300px,100%)}
.chip{min-height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);font-size:13px;color:var(--ink2)}
.chip:hover{color:var(--ink)}.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lib{display:flex;flex-wrap:wrap;gap:12px}.lib .card{cursor:pointer}.from{font-size:11.5px;color:var(--ink3);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--card);border-left:1px solid var(--line);z-index:50;overflow:auto;box-shadow:-24px 0 48px -24px rgba(0,0,0,.25)}
.dh{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.dh h2{flex:1;margin:0;font:700 18px var(--serif)}
.dbody{padding:6px 20px 30px}
.grp{font-size:12px;color:var(--ink3);margin:18px 0 8px}
.f{display:block;margin-bottom:10px;font-size:13px;color:var(--ink2)}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--ink2);background:var(--card)}
.f textarea{min-height:60px;resize:vertical;line-height:1.5}
.f .big{font:500 17px/1.5 var(--serif)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pm{display:flex;margin-top:4px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.pm button{flex:1;min-height:36px;font-size:14px;color:var(--ink2)}.pm button+button{border-left:1px solid var(--line)}
.pm button[aria-pressed=true][data-v="+"]{background:var(--upbg);color:var(--up);font-weight:500}
.pm button[aria-pressed=true][data-v="-"]{background:var(--dnbg);color:var(--dn);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px}
.danger{color:var(--dn)!important}

html:lang(zh-Hans){--sans:"Noto Sans SC";--serif:"Noto Serif SC","Noto Serif TC",serif}
html:lang(ja){--sans:"Noto Sans JP";--serif:"Noto Serif JP","Noto Serif TC",serif}
.sbtn{width:100%;justify-content:flex-start}
.foot{margin-top:auto;padding:14px 8px 0;display:flex;flex-direction:column;gap:10px}
.langsel{min-height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--card);padding:2px 8px;font-size:13px;width:100%}
.modal{position:fixed;inset:0;z-index:70;background:rgba(15,14,12,.45);display:grid;place-items:center;padding:16px}
.sheet{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.sheet .dh{border-radius:14px 14px 0 0}.sheet .dbody{padding:16px 20px 20px}
.step{margin:0 0 10px;font-size:14px;color:var(--ink2)}
.code{display:block;width:100%;min-height:170px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.code:focus{outline:0;border-color:var(--ink2)}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.modes label{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;font-size:13px;cursor:pointer}
.modes input{margin:0;accent-color:var(--ink)}
.modes label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg{font-size:13px;min-height:20px;margin:10px 0 12px;color:var(--ink2)}.msg.err{color:var(--dn)}.msg.ok{color:var(--up)}
details.pr{margin:10px 0 18px}details.pr summary{cursor:pointer;font-size:13px;color:var(--ink2)}details.pr .code{margin-top:8px;min-height:200px}
.acts{flex-wrap:wrap}
@media(max-width:900px){.foot{flex-direction:row;align-items:center;margin:0 0 0 auto;padding:0;flex:none}.langsel{width:auto}.sbtn{width:auto;flex:none}#impBtnSide span{display:none}}
.trbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:-4px 0 14px;font-size:13px;color:var(--ink2)}
.trbar .btn{min-height:32px}.trbar .hint{font-size:12px;color:var(--ink3)}.trmsg{color:var(--warn)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ink);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.subttl{font-size:14px;color:var(--ink3);margin-top:4px}
.orig{font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:8px 10px;margin:12px 0 0}
.card.pinch{border-color:var(--beat);border-style:dashed}.tags .kp{border-style:dashed}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}.bchk{display:flex;flex-wrap:wrap;gap:4px}
.bc{font-size:11.5px;min-height:24px;padding:0 8px;border-radius:999px;border:1px dashed var(--line2);color:var(--ink3);cursor:default}
.bc.on{border:1px solid var(--beat);color:var(--beat);background:var(--beatbg);cursor:pointer}.bc.on.pi{border-style:dashed;background:transparent}
.bc b{font-weight:500}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}
.side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:6px}
.brand{padding:0 8px 0 0}.brand span,.sec{display:none}.fi{grid-template-columns:auto;flex:none;width:auto;padding:6px 10px}.fi svg,.fi small{display:none}
.status span{display:none}.side .btn{flex:none}}
@media(max-width:600px){.lane{grid-template-columns:minmax(0,1fr);gap:4px}.lab{display:flex;gap:8px;align-items:baseline;padding-top:4px}
.card,.add{width:calc(50% - 6px)}.add{min-height:96px}.stats{gap:18px}.stats b{font-size:19px}.fig{height:150px}.main{padding-top:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<nav class="side" aria-label="nav">
  <div class="brand"><svg viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="2" width="20" height="18" rx="4" fill="currentColor"/><g fill="var(--side)"><rect x="4" y="5" width="6" height="4" rx="1"/><rect x="12" y="5" width="6" height="4" rx="1"/><rect x="4" y="13" width="6" height="4" rx="1"/></g><path d="M4 11.5 9 9.5l5 3 4-2" stroke="var(--side)" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg><span data-i="brand"></span></div>
  <button class="btn ghost sbtn" id="libBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span data-i="lib"></span></button>
  <button class="btn ghost sbtn" id="impBtnSide"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M5 7l3 3 3-3"/><path d="M2.5 11v2.5h11V11"/></svg><span data-i="impT"></span></button>
  <div class="sec"><span data-i="myWalls"></span><button id="newBtn">＋ <span data-i="newWall"></span></button></div>
  <div id="flist" style="display:contents"></div>
  <button class="btn ghost" id="newBtn2" hidden>＋ <span data-i="newWall"></span></button>
  <div class="foot"><div class="status" id="statusBox"><i></i><span id="status"></span></div><select class="langsel" id="lang"></select></div>
</nav>
<main class="main">
  <form class="newf" id="newForm" hidden>
    <input id="newTitle">
    <select id="newSrc"></select>
    <button class="btn pri" type="submit" data-i="create"></button>
    <button class="btn ghost" type="button" id="newCancel" data-i="cancel"></button>
  </form>
  <div id="localNote" class="note" hidden data-i="localNote"></div>
  <div id="view"></div>
</main>
</div>
<aside class="drawer" id="drawer" hidden aria-labelledby="dTitle"></aside>
<div class="modal" id="modal" hidden></div>
<script>
{
const TYPES=['開場鉤子','日常','得知真相','做決定','對峙','追逐','告白','重逢','離別','和解','失去','反擊','高潮','尾聲','其他'];
const SRCS=['拉片','自己的片'];
const LANGS=[['zh-Hant','繁體中文'],['zh-Hans','简体中文'],['ja','日本語'],['en','English']];
const D={
'zh-Hant':{fBeat:'節拍',beatNone:'無',beats5:['情節點 1','Pinch 1','中間點','Pinch 2','情節點 2'],beats5Short:['P1','Pi1','中','Pi2','P2'],pinchLeg:'Pinch',beatMissing:'還沒標',trNeed:n=>`${n} 張卡片還是原文`,trBtn:'翻譯',trRun:'翻譯中…',stop:'停止',showOrig:'顯示原文',showTr:'顯示譯文',trFail:'翻譯沒成功，再按一次試試',trDenied:'沒有允許這個頁面使用 Claude，卡片維持原文',trLimited:'用量暫時到上限，晚點再翻譯',origNote:'這裡是原文。改了之後，這張卡會重新翻譯。',trAll:'翻譯所有牆',trHint:'翻譯會用到你的 Claude 用量，譯好的內容會存起來，不用重複翻。',brand:'分場卡片牆',lib:'卡片庫',myWalls:'我的牆',newWall:'新的牆',language:'語言',filmPh:'片名，例如《風車》',filmLabel:'片名',srcLabel:'類別',create:'建立',cancel:'取消',
localNote:'這個畫面沒有連上資料庫，卡片只存在這台瀏覽器裡，Claude 讀不到。',loading:'正在把卡片拿出來…',emptyT:'開第一面牆',emptyB:'一支片一面牆。每場一張卡，排成四排，情緒線會自己連起來。也可以請 AI 輸出代碼，貼進「匯入」直接排好。',

async function translateFilm(fid){
  const f=films[fid];if(!f||trBusy||aiOff||!needAI())return;const tl=lang;
  const todo=missingCards(f),needTitle=f.title&&f.title!=='—'&&f.tr?.[tl]?.__title?.src!==f.title;if(!todo.length&&!needTitle)return;

    for(let i=0;i<Math.max(todo.length,1);i+=40){
      const chunk=todo.slice(i,i+40),hs={},items={};chunk.forEach(c=>{hs[c.id]=hashCard(c);const o={};TRF.forEach(k=>{if(c[k])o[k]=c[k]});items[c.id]=o});
      const withTitle=needTitle&&i===0;if(withTitle)items.__title={title:f.title};
      if(!Object.keys(items).length)break;
      const prompt=`You translate scene cards on a screenwriter's film-breakdown board. Translate every string value below from Chinese into natural ${LANGEN[tl]}, the way a screenwriter would write it. Keep character names consistent across cards, keep "><" exactly as it is, keep numbers, and keep each value about as short as the original. Field meanings: title = film title, place = location and time of day, sum = one-line summary of the scene, conflict = who versus who, scale = progression of shot sizes, light = lighting and colour, quote = a line of dialogue, steal = a technique worth reusing, note = free notes. Reply with only one JSON object with exactly the same keys and nesting, every value translated.\n\n${JSON.stringify(items)}`;
      const out=await sample.json(prompt,{modelTier:'quick',signal:trCtl.signal,cache:{gcTime:86400000}});
      const f2=films[fid];if(!f2)return;f2.tr=f2.tr||{};const m=f2.tr[tl]=f2.tr[tl]||{};
      chunk.forEach(c=>{const o=out&&out[c.id];if(o&&typeof o==='object'){const e={h:hs[c.id]};TRF.forEach(k=>e[k]=c[k]?str(o[k]??c[k],600):'');m[c.id]=e}});
      if(withTitle&&out&&out.__title){const v=typeof out.__title==='object'?out.__title.title:out.__title;if(v)m.__title={src:f.title,v:str(v,80)}}
      commit(fid);

function stripComments(s){let o='',q=false,e=false;for(let i=0;i<s.length;i++){const ch=s[i];
  if(q){o+=ch;if(e)e=false;else if(ch==='\\')e=true;else if(ch==='"')q=false;continue}
  if(ch==='"'){q=true;o+=ch;continue}
  if(ch==='/'&&s[i+1]==='/'){while(i<s.length&&s[i]!=='\n')i++;o+='\n';continue}
  if(ch==='/'&&s[i+1]==='*'){i+=2;while(i<s.length&&!(s[i]==='*'&&s[i+1]==='/'))i++;i++;continue}
  o+=ch}return o}
const allTypeLabels=()=>Object.values(D).map(x=>x.types);
function mapType(v){v=String(v??'').trim();if(!v)return'';for(const list of allTypeLabels()){const i=list.findIndex(x=>x.toLowerCase()===v.toLowerCase());if(i>=0)return TYPES[i]}return TYPES[14]}
function mapSrc(v){v=String(v??'').trim().toLowerCase();for(const d of Object.values(D)){if(d.srcs[1].toLowerCase()===v)return SRCS[1]}return/own|my film|自己|自作/.test(v)?SRCS[1]:SRCS[0]}
function mapPol(v){const s=String(v??'').trim().toLowerCase();if(['-','−','－','負','负','negative','neg','down','minus','-1','マイナス'].includes(s))return'-';if(['+','＋','正','positive','pos','up','plus','1','プラス'].includes(s))return'+';return null}
function mapAct(v){if(v===undefined||v===null||v==='')return null;const s=String(v).trim().toUpperCase().replace(/^ACT\s*/,'');
  const m={'1':0,'2A':1,'2B':2,'3':3,'2':1,'4':3,'0':0,'I':0,'IIA':1,'IIB':2,'III':3};if(s in m)return m[s];
  for(const d of Object.values(D)){const i=d.acts.findIndex(a=>a.toUpperCase()===s);if(i>=0)return i}return null}
function mapBeat(v){const s=String(v??'').trim().toUpperCase().replace(/[\s_\-]/g,'');if(!s)return'';
  const m={PP1:'pp1',PLOTPOINT1:'pp1',P1:'p1',PINCH1:'p1',PI1:'p1',MID:'mid',MIDPOINT:'mid',MP:'mid',P2:'p2',PINCH2:'p2',PI2:'p2',PP2:'pp2',PLOTPOINT2:'pp2'};if(m[s])return m[s];
  for(const d of Object.values(D)){const i=d.beats5.findIndex(b=>b.toUpperCase().replace(/[\s_\-]/g,'')===s);if(i>=0)return BEATS[i]}return''}
function parseImport(txt){
  let s=String(txt||'').trim();if(!s)return null;
  const fence=s.match(/```[a-zA-Z]*\s*([\s\S]*?)```/);if(fence)s=fence[1];
  s=s.replace(/[“”]/g,'"');
  const a=[s.indexOf('{'),s.indexOf('[')].filter(x=>x>=0);if(!a.length)throw new Error('parse');
  const st=Math.min(...a),en=Math.max(s.lastIndexOf('}'),s.lastIndexOf(']'));s=s.slice(st,en+1);
  s=stripComments(s).replace(/,\s*([}\]])/g,'$1');
  let o;try{o=JSON.parse(s)}catch(e){throw new Error('parse')}
  if(Array.isArray(o))o={scenes:o};
  const list=o.scenes||o.cards||o.scene||[];if(!Array.isArray(list)||!list.length)throw new Error('empty');
  let cards=list.filter(x=>x&&typeof x==='object').map(x=>{const from=mapPol(x.from??x.start),to=mapPol(x.to??x.end);
    return{raw:mapAct(x.act??x.row),k:x.key===true||x.key==='true'||x.key===1||x.key==='是',c:normCard({id:uid(),place:x.place??x.location??'',sum:x.sum??x.summary??x.logline??'',type:mapType(x.type),from:from||'+',to:to||'-',
    st:(x.strength??x.st)==2?2:1,conflict:x.conflict??'',beat:mapBeat(x.beat),key:x.key===true||x.key==='true'||x.key===1||x.key==='是',
    dur:x.dur??x.duration??'',shots:x.shots??'',scale:x.scale??'',light:x.light??'',quote:x.quote??'',steal:x.steal??x.takeaway??'',note:x.note??x.notes??''})}});
  if(!cards.length)throw new Error('empty');
  if(cards.some(r=>r.raw!==null)){let last=0;cards.forEach(r=>{r.c.act=r.raw!==null?r.raw:last;last=r.c.act})}
  else if(cards.some(r=>isMajor(r.c))){let a2=0;cards.forEach(r=>{r.c.act=Math.min(3,a2);if(isMajor(r.c))a2++})}
  else{const n=cards.length;cards.forEach((r,i)=>r.c.act=Math.min(3,Math.floor(i*4/n)))}
  cards.forEach(r=>{if(!r.c.beat&&r.k)r.c.beat=['pp1','mid','pp2','pp2'][r.c.act]});
  return{title:str(o.title,80),src:mapSrc(o.src),cards:cards.map(r=>r.c)};
}

  <p class="step">${esc(t('expHint'))}<\/p><textarea class="code" id="expTxt" readonly spellcheck="false" style="min-height:280px">${esc(code)}<\/textarea>
  <div class="msg" id="mMsg" aria-live="polite"><\/div>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>${esc(t('close'))}<\/button><button class="btn pri" id="cpCode">${I.copy}${esc(t('copyCode'))}<\/button><\/div><\/div>`);
  $('#cpCode').onclick=e=>copyText(code,e.currentTarget,$('#expTxt'));
}

/* ---------- drag ---------- */
function startDrag(){
  const el=drag.el,r=el.getBoundingClientRect();drag.dx=drag.x0-r.left;drag.dy=drag.y0-r.top;
  const g=el.cloneNode(true);g.classList.add('dragcopy');g.style.width=r.width+'px';document.body.appendChild(g);drag.ghost=g;
  el.classList.add('ph');drag.on=true;drag.before=JSON.stringify(ordered(films[cur]).map(c=>c.id+':'+c.act));
}
function moveDrag(e){
  drag.ghost.style.transform=`translate(${e.clientX-drag.dx}px,${e.clientY-drag.dy}px) rotate(1.5deg)`;
  const conts=[...document.querySelectorAll('#board .cards')];let best=null,bd=1e9;
  for(const c of conts){const r=c.getBoundingClientRect();const d=e.clientY<r.top?r.top-e.clientY:e.clientY>r.bottom?e.clientY-r.bottom:0;if(d<bd){bd=d;best=c}}
  if(best){const items=[...best.querySelectorAll('.card:not(.ph)')];
    const before=items.find(it=>{const r=it.getBoundingClientRect();return e.clientY<r.top||(e.clientY<=r.bottom&&e.clientX<r.left+r.width/2)})||best.querySelector('.add');
    if(drag.el.nextElementSibling!==before||drag.el.parentNode!==best)best.insertBefore(drag.el,before)}
  if(e.clientY<70)scrollBy(0,-14);else if(e.clientY>innerHeight-70)scrollBy(0,14);
}
function endDrag(){
  drag.ghost.remove();drag.el.classList.remove('ph');const f=films[cur];const map=Object.fromEntries(f.cards.map(c=>[c.id,c]));
  const next=[];document.querySelectorAll('#board .cards').forEach(ct=>{const a=+ct.dataset.act;ct.querySelectorAll('.card').forEach(el=>{const c=map[el.dataset.id];if(c)next.push({...c,act:a})})});
  if(JSON.stringify(next.map(c=>c.id+':'+c.act))!==drag.before&&next.length===f.cards.length){snapshotUndo(cur);f.cards=next;commit(cur)}
  justDragged=Date.now();render();
}
document.addEventListener('pointerdown',e=>{
  if(view!=='board'||e.button>0)return;const c=e.target.closest('#board .card');if(!c)return;
  if(e.pointerType!=='mouse'&&!e.target.closest('.grip'))return;
  drag={el:c,x0:e.clientX,y0:e.clientY,on:false};if(e.target.closest('.grip'))e.preventDefault();
});
addEventListener('pointermove',e=>{if(!drag)return;if(!drag.on){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;startDrag()}moveDrag(e)},{passive:true});
addEventListener('pointerup',()=>{if(!drag)return;if(drag.on)endDrag();drag=null});
addEventListener('pointercancel',()=>{if(drag?.on){drag.ghost.remove();render()}drag=null});

/* ---------- events ---------- */
function showNew(){$('#newForm').hidden=false;$('#newTitle').focus()}
document.addEventListener('click',e=>{
  const tg=e.target;if(Date.now()-justDragged<300)return;
  if(tg.closest('[data-close]')||tg.id==='modal'){closeModal();return}
  if(tg.closest('#trGo')){const sc=tg.closest('#trGo').dataset.scope;lsSet('autoTr',true);sc==='all'?translateAll():translateFilm(cur);return}
  if(tg.closest('#trStop')){trCtl?.abort();return}
  if(tg.closest('#trOrig')){showOrig=!showOrig;render();return}
  const act=tg.closest('[data-act="import"],[data-act="export"]');if(act){act.dataset.act==='import'?openImport():openExport();return}
  const fi=tg.closest('.fi');if(fi){cur=fi.dataset.f;lsSet('cur',cur);view='board';delArm=null;clearHash();closeEditor();render();return}
  if(tg.closest('.add')){addCard(+tg.closest('.add').dataset.act);return}
  if(tg.closest('#emptyNew')){showNew();return}
  if(tg.closest('#undoBtn')){const u=undo.pop();if(!u||!films[u.fid])return render();films[u.fid].cards=u.cards.map(normCard);cur=u.fid;closeEditor();commit(u.fid);render();return}
  if(tg.closest('#delFilm')){if(delArm!==cur){delArm=cur;renderBoard();return}const id=cur;delete films[id];delArm=null;undo=undo.filter(u=>u.fid!==id);
    if(mode==='db')db.doc('films/'+id).delete().catch(()=>setStatus('delFail',true));else lsSet('films',films);cur=null;closeEditor();render();return}
  const g=tg.closest('#yarn g[data-id],.bc[data-goto]');if(g){const el=document.querySelector(`#board .card[data-id="${CSS.escape(g.dataset.id||g.dataset.goto)}"]`);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}return}
  const lc=tg.closest('.lib .card');if(lc){cur=lc.dataset.film;lsSet('cur',cur);view='board';clearHash();render();openEditor(lc.dataset.id);return}
  const ch=tg.closest('.chip');if(ch){libType=ch.dataset.t;renderLib();return}
  const bc=tg.closest('#board .card');if(bc&&!tg.closest('.grip'))openEditor(bc.dataset.id);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').hidden){closeModal();return}if(editing){closeEditor();return}}
  const c=e.target.closest?.('.card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click()}
});
document.addEventListener('change',e=>{if(e.target.id==='ftitle'){const f=films[cur];if(f&&e.target.value.trim()){f.title=e.target.value.trim().slice(0,80);commit(cur);renderSide()}}});
document.addEventListener('input',e=>{if(e.target.id==='libQ'){libQ=e.target.value;const p=e.target.selectionStart;renderLib();const q=$('#libQ');q.focus();q.setSelectionRange(p,p)}});
$('#libBtn').onclick=()=>{view='library';location.hash='library';closeEditor();render()};
$('#impBtnSide').onclick=openImport;
addEventListener('hashchange',()=>{view=location.hash==='#library'?'library':'board';render()});
$('#newBtn').onclick=showNew;$('#newBtn2').onclick=showNew;
$('#newCancel').onclick=()=>{$('#newForm').hidden=true};
$('#newForm').onsubmit=e=>{e.preventDefault();const v=$('#newTitle').value.trim();if(!v){$('#newTitle').focus();return}newFilm(v,$('#newSrc').value);$('#newTitle').value='';$('#newForm').hidden=true};
$('#lang').innerHTML=LANGS.map(([k,n])=>`<option value="${k}"${k===lang?' selected':''}>${n}<\/option>`).join('');
$('#lang').onchange=e=>{trCtl?.abort();trMsg='';showOrig=false;lang=e.target.value;L=D[lang];lsSet('lang',lang);applyStatic();const ed=editing;closeEditor();closeModal();render();if(ed)openEditor(ed)};

function goLocal(){mode='local';const raw=lsGet('films',{});films={};for(const k in raw)films[k]=normFilm(k,raw[k]);$('#localNote').hidden=false;setStatus('localOnly',true);render()}
applyStatic();render();loadOpenCC();
(async()=>{
  try{db=window.claude?.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db)return goLocal();
  mode='db';const tm=setTimeout(()=>{setStatus('slow',true);render()},10000);
  db.collection('films').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(tm);setStatus('synced')}
    const next={};snap.docs.forEach(d=>{const v=d.data();if(v)next[d.id]=normFilm(d.id,v)});
    for(const id in films)if((local[id]||saving[id])&&films[id])next[id]=films[id];
    films=next;if(drag?.on)return;
    if(editing){if(view==='board')rerenderKeep()}else render();
  },err=>{clearTimeout(tm);if(['revoked','not_granted','capability_disabled'].includes(err?.code))goLocal();else{setStatus('readFail',true);render()}});
})();

}
</script>
</body>
</html>
